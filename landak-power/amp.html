        /* ================================
           GRID TOMBOL
        ================================= */

        .button-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;

        }


        /* ================================
           TOMBOL SILVER CHROME
        ================================= */

        .btn-action {
            display: block;

            padding: 15px 5px;

            font-size: 16px;
            font-weight: 800;

            text-decoration: none;
            text-align: center;

            position: relative;
            overflow: hidden;

            border-radius: 10px;

            background: linear-gradient(
                145deg,
                #e6e6e6 0%,
                #ffffff 25%,
                #b3b3b3 45%,
                #f2f2f2 70%,
                #8c8c8c 100%
            );

            color: #111;

            text-shadow:
                1px 1px 1px rgba(255,255,255,0.8);

            border: 1px solid #d9d9d9;

            box-shadow:
                0 4px 15px rgba(255,255,255,0.1),
                inset 0 1px 2px #fff;

            transition: transform 0.2s ease;
        }


        /* ================================
           KILATAN PETIR
        ================================= */

        .btn-action::before {

            content: "";

            position: absolute;

            top: 0;
            left: -150%;

            width: 50%;
            height: 100%;

            background: linear-gradient(
                90deg,
                rgba(255,255,255,0) 0%,
                rgba(255,255,255,0.9) 50%,
                rgba(255,255,255,0) 100%
            );

            transform: skewX(-30deg);

            animation:
                lightning-strike 2.5s ease-in-out infinite;
        }


        @keyframes lightning-strike {

            0% {
                left: -150%;
                opacity: 0;
            }

            10% {
                left: 150%;
                opacity: 1;
            }

            12% {
                opacity: 0;
            }

            20% {
                left: -150%;
                opacity: 0;
            }

            22% {
                left: 150%;
                opacity: 1;
            }

            24% {
                opacity: 0;
            }

            100% {
                left: 150%;
                opacity: 0;
            }
        }


        /* ================================
           GLOW TOMBOL
        ================================= */

        .glow-on-hover {
            cursor: pointer;
            position: relative;
            z-index: 0;
        }


        .glow-on-hover::after {

            content: "";

            position: absolute;

            top: -2px;
            left: -2px;

            width: calc(100% + 4px);
            height: calc(100% + 4px);

            background: linear-gradient(
                45deg,
                #ffffff,
                #15ff00,
                #ffffff,
                #ff6600
            );

            background-size: 400%;

            z-index: -1;

            filter: blur(4px);

            animation:
                chrome-glow 12s linear infinite;

            border-radius: 12px;

            opacity: 0.7;
        }


        @keyframes chrome-glow {

            0% {
                background-position: 0 0;
            }

            50% {
                background-position: 400% 0;
            }

            100% {
                background-position: 0 0;
            }
        }


        .btn-action:hover {
            transform: scale(1.03);
        }
